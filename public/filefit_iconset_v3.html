
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{background:#1C1C1E;border-radius:18px;padding:20px}
.cat{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.2em;color:#444;text-transform:uppercase;margin:18px 0 10px}
.cat:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px 11px;background:#111;border-radius:14px;border:.5px solid #222}
.lbl{font-family:'Courier New',monospace;font-size:9.5px;color:#555;text-align:center;line-height:1.35}
</style>

<div class="wrap">

<div class="cat">Image</div>
<div class="grid">

  <div class="card">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <rect x="8" y="6" width="22" height="27" rx="4" fill="#F5F0E8"/>
      <rect x="14" y="13" width="16" height="19" rx="3" fill="#FF5C2E"/>

      <path d="M20 19l2-2 2 2M20 27l2 2 2-2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="lbl">Resize Image</span>
  </div>

  <div class="card">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <rect x="8" y="6" width="22" height="27" rx="4" fill="#F5F0E8"/>

    </svg>
    <span class="lbl">Compress Image</span>
  </div>

  <div class="card">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <rect x="6" y="7" width="20" height="26" rx="4" fill="#F5F0E8"/>

      <path d="M23 21h10M23 25h7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      <path d="M17 21.5l3 0M17.5 20l2.5 1.5-2.5 1.5" stroke="#0F0F0F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/>

</div>

      <path d="M10 21c2-4 3.5-6 6-6s2.5 4 5 4 3.5-3 6-3" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <path d="M26 30l2.5 2.5 5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="lbl">Resize Signature</span>
  </div>

  <div class="card">

      <rect x="6" y="10" width="26" height="18" rx="4" fill="#F5F0E8"/>

      <rect x="18" y="22" width="18" height="16" rx="4" fill="#FF5C2E"/>
      <path d="M22 30l5-4M22 30l5 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M11 22l3 3 3-3" stroke="#aaa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="22" width="18" height="16" rx="4" fill="#FF5C2E"/>
